name: AG-02 Art.5 Runtime Proof

on:
  push:
    branches: [ main, develop, 'copilot/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  art5-runtime-proof:
    name: Art.5 Runtime Proof (CR-001)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify commit SHA
        run: |
          echo "Tested commit: $(git log -1 --format=%H)"

      - name: DEFAULT — Art.5 runtime proof
        run: |
          echo "=== DEFAULT ==="
          python scripts/art5_conformance_proof.py

      - name: -O — Art.5 runtime proof
        run: |
          echo "=== -O ==="
          python -O scripts/art5_conformance_proof.py

      - name: -OO — Art.5 runtime proof
        run: |
          echo "=== -OO ==="
          python -OO scripts/art5_conformance_proof.py

      - name: Summary
        run: |
          echo ""
          echo "============================================"
          echo "AG-02 Art.5 Runtime Proof — ALL MODES DONE"
          echo "DEFAULT  → executed above"
          echo "-O       → executed above"
          echo "-OO      → executed above"
          echo "Commit: $(git log -1 --format=%H)"
          echo "============================================"
