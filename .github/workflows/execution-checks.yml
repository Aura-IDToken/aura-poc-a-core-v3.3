name: Execution Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  execution-checks:
    name: Run Mandatory Execution Checks (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 — verified platform
          - runner: ubuntu-latest
            platform: x86_64
          # ARM64 — verified platform (GitHub-hosted ubuntu-24.04-arm)
          - runner: ubuntu-24.04-arm
            platform: arm64
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Run Execution Checks
        run: |
          chmod +x scripts/run_all_checks.sh
          ./scripts/run_all_checks.sh
      
      - name: Generate determinism report
        run: python scripts/generate_determinism_report.py determinism-report.json

      - name: Upload determinism report
        uses: actions/upload-artifact@v4
        with:
          name: determinism-report-${{ matrix.platform }}
          path: determinism-report.json
          retention-days: 30

      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-results-${{ matrix.platform }}
          path: |
            core/test_bitwise_replay_*.hash
          retention-days: 30

  compare-determinism:
    name: Compare Cross-Platform Determinism
    needs: execution-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download x86_64 report
        uses: actions/download-artifact@v4
        with:
          name: determinism-report-x86_64
          path: ./reports/x86_64

      - name: Download arm64 report
        uses: actions/download-artifact@v4
        with:
          name: determinism-report-arm64
          path: ./reports/arm64

      - name: Compare determinism reports
        run: |
          python scripts/compare_determinism_reports.py \
            ./reports/x86_64/determinism-report.json \
            ./reports/arm64/determinism-report.json

      - name: Upload combined determinism report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: determinism-reports-all-platforms
          path: ./reports/
          retention-days: 90
